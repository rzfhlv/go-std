name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (saves queue time on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint with the repo's .golangci.yml (v2 config), including
      # the depguard rules that enforce module boundaries and the
      # stdlib-only domain rule. Also runs the gofumpt formatter check.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Vet
        run: make vet
